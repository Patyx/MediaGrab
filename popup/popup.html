<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MediaGrab</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>MediaGrab</h1>
    <div class="actions">
      <button id="all" class="primary" hidden>Download all</button>

  </header>
  <div id="notice" hidden></div>
  <main id="list"><p class="muted">Looking for media…</p></main>
  <script type="module" src="popup.js"></script>
</body>
</html>
